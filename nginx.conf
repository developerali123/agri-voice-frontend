server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files and fallback to index.html for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: If you need Nginx to proxy /chat to your backend, uncomment the lines below
    # location /chat {
    #     # Replace this with your actual backend URL
    #     proxy_pass https://agri-voice-backend-665843018174.us-central1.run.app/chat;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
